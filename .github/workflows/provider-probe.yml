name: Provider probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/provider-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Nasdaq filings endpoints
        shell: python
        run: |
          import urllib.request
          headers={
            "User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/141 Safari/537.36",
            "Accept":"application/json,text/plain,*/*",
            "Accept-Language":"en-US,en;q=0.9"
          }
          urls=[
            "https://api.nasdaq.com/api/company/AAPL/sec-filings?limit=20",
            "https://api.nasdaq.com/api/quote/AAPL/sec-filings?assetclass=stocks",
            "https://api.nasdaq.com/api/company/AAPL/sec-filings?limit=20&sortColumn=filed&sortOrder=desc",
            "https://api.nasdaq.com/api/quote/AAPL/secfilings?assetclass=stocks",
            "https://api.nasdaq.com/api/company/AAPL/secfilings?limit=20"
          ]
          for url in urls:
            print("\nPROBE",url,flush=True)
            try:
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:
                raw=r.read(5000)
                print("STATUS",r.status,"CTYPE",r.headers.get("content-type"),flush=True)
                print(raw.decode("utf-8","replace")[:4500],flush=True)
            except Exception as e:
              print("ERROR",repr(e),flush=True)
