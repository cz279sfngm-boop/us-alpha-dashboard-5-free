name: Provider probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/provider-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe SEC and Nasdaq research providers
        shell: python
        run: |
          import urllib.request
          tests = [
            ("SEC-UA", "https://www.sec.gov/files/company_tickers.json", {
              "User-Agent":"USMultiHorizonAlphaDashboard/5.1 github.com/cz279sfngm-boop/us-alpha-dashboard-5-free",
              "Accept":"application/json,text/plain,*/*"
            }),
            ("SEC-BROWSER", "https://www.sec.gov/files/company_tickers.json", {
              "User-Agent":"Mozilla/5.0 AppleWebKit/537.36 Chrome/141 Safari/537.36",
              "Accept":"application/json,text/plain,*/*"
            }),
            ("SEC-SUB", "https://data.sec.gov/submissions/CIK0000320193.json", {
              "User-Agent":"USMultiHorizonAlphaDashboard/5.1 github.com/cz279sfngm-boop/us-alpha-dashboard-5-free",
              "Accept":"application/json,text/plain,*/*"
            }),
            ("NASDAQ-REV", "https://api.nasdaq.com/api/analyst/AAPL/earnings-forecast", {
              "User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/141 Safari/537.36",
              "Accept":"application/json,text/plain,*/*"
            }),
          ]
          for label,url,headers in tests:
            print("\nPROBE",label,url,flush=True)
            try:
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:
                raw=r.read(1000)
                print("STATUS",r.status,"CTYPE",r.headers.get("content-type"),flush=True)
                print(raw.decode("utf-8","replace")[:900],flush=True)
            except Exception as e:
              print("ERROR",repr(e),flush=True)
