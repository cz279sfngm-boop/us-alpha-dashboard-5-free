name: Provider probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/provider-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe public research providers
        shell: python
        run: |
          import json, urllib.request, urllib.parse, urllib.error
          urls = [
            "https://api.nasdaq.com/api/analyst/AAPL/earnings-forecast",
            "https://api.nasdaq.com/api/analyst/AAPL/recommendations",
            "https://api.nasdaq.com/api/analyst/AAPL/earnings-per-share",
            "https://api.nasdaq.com/api/quote/AAPL/analyst-research?assetclass=stocks",
            "https://api.nasdaq.com/api/quote/AAPL/news?assetclass=stocks",
            "https://api.nasdaq.com/api/news/topic/articlebysymbol?q=AAPL%7Cstocks",
            "https://api.nasdaq.com/api/company/AAPL/company-news",
            "https://news.google.com/rss/search?q=AAPL%20Apple%20stock&hl=en-US&gl=US&ceid=US:en"
          ]
          browser = {
            "User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/141 Safari/537.36",
            "Accept":"application/json,text/plain,*/*",
            "Accept-Language":"en-US,en;q=0.9",
          }
          for url in urls:
            print("\nPROBE", url, flush=True)
            try:
              req=urllib.request.Request(url,headers=browser)
              with urllib.request.urlopen(req,timeout=30) as r:
                raw=r.read(5000)
                print("STATUS",r.status,"CTYPE",r.headers.get("content-type"),"LEN",r.headers.get("content-length"), flush=True)
                print(raw.decode("utf-8","replace")[:4500], flush=True)
            except Exception as e:
              print("ERROR",repr(e), flush=True)
