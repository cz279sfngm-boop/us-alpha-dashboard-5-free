name: Scan market and deploy dashboard

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Scan mode label
        required: false
        default: manual
  push:
    branches: [main]
    paths:
      - 'scanner/**'
      - 'site/**'
      - 'requirements.txt'
      - '.github/workflows/scan-and-deploy.yml'
  schedule:
    - cron: '30 8 * * 1-5'
      timezone: 'America/New_York'
    - cron: '0 10 * * 1-5'
      timezone: 'America/New_York'
    - cron: '45 16 * * 1-5'
      timezone: 'America/New_York'
    - cron: '0 11 * * 6'
      timezone: 'America/New_York'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: alpha-dashboard
  cancel-in-progress: true

jobs:
  scan-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Restore Yahoo OHLCV cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: alpha-ohlcv-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_number }}
          restore-keys: |
            alpha-ohlcv-${{ runner.os }}-${{ github.ref_name }}-

      - name: Install scanner dependencies
        run: pip install -r requirements.txt

      - name: Validate source syntax
        run: |
          python -m py_compile scanner/main.py scanner/research.py
          node --check site/app.js

      - name: Run research scan
        env:
          ALPHA_WORKERS: '10'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: 'gemini-3.6-flash'
          AI_RESEARCH_LIMIT: '12'
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then MODE="push-or-scheduled-${{ github.event.schedule }}"; fi
          python scanner/main.py --mode "$MODE" --output site/data/latest.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
